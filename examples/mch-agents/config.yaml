# MCH Agents Configuration for Emojicom

agents:
  - id: "primary_agent"
    type: "communicative"
    capabilities:
      - perception
      - communication
      - reasoning
    emojicom_enabled: true

communication:
  protocol: "emojicom"
  format: "json"
  timeout: 30
  retry_attempts: 3

perception:
  universal_states: true
  emotional_dimension: true
  intentional_framework: true

examples:
  - name: "basic_greeting"
    input: "👋"
    output: "👋😊"
  
  - name: "query_response"
    input: "❓"
    output: "✅💡"
  
  - name: "error_handling"
    input: "❌"
    output: "⚠���🔧"
